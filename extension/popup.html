<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NSAuth2 Cookie Keeper</title>
    <style>
      :root {
        --ns-green: #2ea44f;
        --ns-green-dark: #237a3e;
        --ns-green-soft: #e8f6ec;
        --text: #24292f;
        --text-dim: #57606a;
        --text-faint: #6e7781;
        --border: #e5e7eb;
        --danger: #dc2626;
        --danger-soft: #fdf0f0;
        --ok: #16a34a;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        background: #fff;
        color: var(--text);
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC",
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--border);
      }
      .header .logo {
        width: 28px;
        height: 28px;
        flex: none;
        border-radius: 7px;
        background: var(--ns-green);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .header .title {
        font-size: 14px;
        font-weight: 600;
      }
      .header .badge {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-faint);
        background: #f6f8fa;
        padding: 1px 8px;
        border-radius: 999px;
      }

      .body {
        padding: 12px 14px;
      }

      .empty {
        text-align: center;
        color: var(--text-dim);
        padding: 18px 8px 8px;
      }
      .empty .icon {
        color: var(--text-faint);
        margin-bottom: 8px;
      }
      .empty .guide {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
        color: var(--text);
      }
      .empty p {
        margin: 4px 0 12px;
        font-size: 12px;
        color: var(--text-dim);
      }

      .status {
        padding: 4px 0;
      }
      .kv-row {
        display: flex;
        gap: 8px;
        padding: 5px 0;
        font-size: 12px;
        align-items: baseline;
      }
      .kv-row .k {
        width: 62px;
        color: var(--text-faint);
        flex: none;
      }
      .kv-row .v {
        font-weight: 500;
        word-break: break-all;
      }
      .kv-row .v.sub {
        color: var(--text-dim);
        font-weight: 400;
      }

      .result-line {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 6px;
        margin-top: 6px;
        font-size: 12px;
      }
      .result-line.ok {
        background: var(--ns-green-soft);
        color: var(--ok);
      }
      .result-line.bad {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .result-line svg {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .result-line .res-msg {
        color: var(--text-dim);
        font-weight: 400;
      }

      .footer {
        display: flex;
        gap: 8px;
        padding: 10px 14px 12px;
        border-top: 1px solid var(--border);
      }
      .btn {
        flex: 1;
        height: 34px;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
      }
      .btn svg {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--ns-green);
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--ns-green-dark);
      }
      .btn-secondary {
        background: #fff;
        color: var(--text);
        border-color: var(--border);
      }
      .btn-secondary:hover:not(:disabled) {
        border-color: var(--text-dim);
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <span class="title">NSAuth2 Cookie Keeper</span>
      <span class="badge" id="status-badge">无配置</span>
    </div>

    <div class="body">
      <!-- 未配置 -->
      <div class="empty" id="empty-view">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l-3 3-3-3"/><path d="M21 6v5a2 2 0 0 1-2 2H8"/>
          </svg>
        </div>
        <p class="guide">尚未配置</p>
        <p>完成 4 步向导即可开启 Cookie 静默推送。</p>
        <button class="btn btn-primary" id="btn-configure" style="flex:none;width:auto;display:inline-flex;padding:0 16px;">
          点击配置
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <!-- 已配置状态区 -->
      <div class="status" id="status-view" hidden></div>
    </div>

    <div class="footer">
      <button class="btn btn-primary" id="btn-push">
        <svg id="icon-push" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <span>立即推送</span>
      </button>
      <button class="btn btn-secondary" id="btn-options">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/></svg>
        <span>设置</span>
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
