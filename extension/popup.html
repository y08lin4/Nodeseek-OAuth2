<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NSAuth2 Cookie Keeper</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .empty {
        color: #6b7280;
        padding: 8px 0;
      }
      .slot {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .slot-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .dot.ok {
        background: #16a34a;
      }
      .dot.bad {
        background: #dc2626;
      }
      .dot.off {
        background: #9ca3af;
      }
      .slot-url {
        color: #6b7280;
        font-size: 12px;
        word-break: break-all;
      }
      .slot-result {
        font-size: 12px;
        color: #374151;
      }
      .slot-time {
        font-size: 11px;
        color: #9ca3af;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 6px 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>NSAuth2 Cookie Keeper</h1>
    <div id="slot-list"></div>
    <p id="empty-hint" class="empty" hidden>尚未配置槽位，请打开设置页添加。</p>
    <div class="actions">
      <button id="btn-push-all">立即推送全部</button>
      <button id="btn-options">打开设置</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
