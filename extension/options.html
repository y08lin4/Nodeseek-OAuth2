<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NSAuth2 Cookie Keeper - 设置</title>
    <style>
      body {
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
        font: 14px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      h1 {
        font-size: 18px;
      }
      .intro {
        color: #6b7280;
        font-size: 13px;
        margin-bottom: 14px;
      }
      .slot {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .slot-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .slot-head input[type="text"] {
        flex: 1;
      }
      .enabled-label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 600;
        white-space: nowrap;
      }
      .del {
        margin-left: auto;
      }
      .field {
        margin-top: 8px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #374151;
        margin-bottom: 2px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 8px;
      }
      .hint {
        color: #6b7280;
        font-size: 12px;
        margin: 2px 0 0;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
      }
      button {
        padding: 6px 16px;
        cursor: pointer;
      }
      #save-status {
        color: #16a34a;
        font-size: 13px;
      }
      #save-error {
        color: #dc2626;
        font-size: 13px;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>NSAuth2 Cookie Keeper 设置</h1>
    <p class="intro">
      多槽位：每个浏览器 profile 配置自己的账号槽位，每个启用槽位会把 nodeseek 登录 Cookie
      推送到对应 serverUrl。服务器源域名必须与 manifest.json 的 host_permissions 中声明的源一致
      （占位符 ns.example.com 部署前需改为真实域名），否则推送请求会被浏览器拦截。
    </p>
    <div id="slot-list"></div>
    <div class="toolbar">
      <button id="btn-add">新增槽位</button>
      <button id="btn-save">保存</button>
      <span id="save-status"></span>
    </div>
    <p id="save-error"></p>
    <script src="options.js"></script>
  </body>
</html>
