<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NSAuth2 Cookie Keeper - 设置</title>
    <style>
      :root {
        --ns-green: #2ea44f;
        --ns-green-dark: #237a3e;
        --ns-green-soft: #e8f6ec;
        --text: #24292f;
        --text-dim: #57606a;
        --text-faint: #6e7781;
        --border: #e5e7eb;
        --danger: #dc2626;
        --danger-soft: #fdf0f0;
        --ok: #16a34a;
        --bg: #ffffff;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC",
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 20px 48px;
      }
      .page-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }
      .page-head .logo {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 8px;
        background: var(--ns-green);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .page-head h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 600;
      }
      .page-head .sub {
        font-size: 12px;
        color: var(--text-faint);
        margin-top: 1px;
      }

      /* -------- 步骤条 -------- */
      .steps {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 22px;
      }
      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .step-dot {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--border);
        color: var(--text-faint);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .step.active .step-dot {
        border-color: var(--ns-green);
        color: var(--ns-green);
        box-shadow: 0 0 0 3px var(--ns-green-soft);
      }
      .step.done .step-dot {
        background: var(--ns-green);
        border-color: var(--ns-green);
        color: #fff;
      }
      .step-label {
        font-size: 11px;
        color: var(--text-faint);
        white-space: nowrap;
      }
      .step.active .step-label {
        color: var(--text);
        font-weight: 600;
      }
      .step-connector {
        flex: 0 0 12px;
        height: 2px;
        background: var(--border);
        border-radius: 1px;
        margin-top: -14px;
      }
      .step-connector.done {
        background: var(--ns-green);
      }

      /* -------- 卡片 -------- */
      .card {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 20px;
        background: #fff;
      }
      .field {
        margin-bottom: 14px;
      }
      .field:last-child {
        margin-bottom: 0;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 6px;
        font-weight: 500;
      }
      input[type="text"],
      input[type="password"],
      input[type="number"] {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        color: var(--text);
        background: #fff;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus {
        border-color: var(--ns-green);
        box-shadow: 0 0 0 3px var(--ns-green-soft);
      }
      input::placeholder {
        color: var(--text-faint);
      }
      .hint {
        font-size: 12px;
        color: var(--text-faint);
        margin: 6px 0 0;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .row > .field {
        flex: 1;
      }
      .row .btn {
        flex: none;
        margin-bottom: 0;
      }

      /* -------- 按钮 -------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 16px;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
        white-space: nowrap;
        user-select: none;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--ns-green);
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--ns-green-dark);
      }
      .btn-secondary {
        background: #fff;
        color: var(--text);
        border-color: var(--border);
      }
      .btn-secondary:hover:not(:disabled) {
        border-color: var(--text-dim);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-dim);
      }
      .btn-ghost:hover:not(:disabled) {
        color: var(--text);
      }
      .wizard-footer {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 18px;
      }
      .wizard-footer .right {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }

      /* -------- 状态提示 -------- */
      .msg {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 6px;
      }
      .msg svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .msg.ok {
        color: var(--ok);
        background: #eaf7ef;
      }
      .msg.err {
        color: var(--danger);
        background: var(--danger-soft);
      }
      .msg.loading {
        color: var(--text-dim);
        background: #f6f8fa;
      }
      .msg .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* -------- 账号识别结果 -------- */
      .account-box {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .account-box .row {
        display: flex;
        align-items: center;
        padding: 10px 14px;
        font-size: 13px;
      }
      .account-box .row + .row {
        border-top: 1px solid var(--border);
      }
      .account-box .k {
        width: 56px;
        color: var(--text-faint);
        flex: none;
      }
      .account-box .v {
        font-weight: 600;
      }
      .account-box .v.rank-missing {
        color: var(--text-faint);
        font-weight: 400;
      }

      /* -------- 摘要卡 -------- */
      .summary-meta {
        color: var(--text-faint);
        font-size: 13px;
        margin: 0 0 14px;
      }
      .summary-meta strong {
        color: var(--text);
      }
      .kv-grid {
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .kv-grid .kv-row {
        display: flex;
        padding: 10px 14px;
        font-size: 13px;
        align-items: baseline;
        gap: 8px;
      }
      .kv-grid .kv-row + .kv-row {
        border-top: 1px solid var(--border);
      }
      .kv-grid .kv-k {
        width: 96px;
        color: var(--text-faint);
        flex: none;
      }
      .kv-grid .kv-v {
        font-weight: 500;
      }
      .op-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .slot-actions {
        border-top: 1px solid var(--border);
        margin-top: 16px;
        padding-top: 16px;
      }
      .enabled-badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        margin-left: auto;
      }
      .enabled-badge.on {
        background: var(--ns-green-soft);
        color: var(--ns-green);
      }
      .enabled-badge.off {
        background: #f6f8fa;
        color: var(--text-faint);
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 14px 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="page-head">
        <div class="logo" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div>
          <h1>NSAuth2 Cookie Keeper</h1>
          <div class="sub">设置与初始化向导</div>
        </div>
      </div>

      <!-- ============ 向导视图 ============ -->
      <section id="wizard-view">
        <div class="steps" id="step-indicator"></div>

        <div class="card">
          <!-- 第 1 步：服务地址 -->
          <section id="panel-1">
            <div class="field">
              <label>服务地址（域名）</label>
              <input type="text" id="server-input" placeholder="nodeseek-ouath.ailinyu.de" autocomplete="off" spellcheck="false" />
              <p class="hint">只填写域名，将自动补全 https:// 并校验格式。</p>
            </div>
            <div id="step1-msg" class="msg" hidden></div>
          </section>

          <!-- 第 2 步：管理令牌 -->
          <section id="panel-2" hidden>
            <div class="row">
              <div class="field">
                <label>管理令牌（X-Admin-Token）</label>
                <input type="password" id="token-input" placeholder="服务端 NS_ADMIN_TOKEN" autocomplete="off" />
              </div>
              <button class="btn btn-secondary" id="btn-verify">
                <svg id="icon-verify" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-3 3-3-3"/><path d="M21 6v5a2 2 0 0 1-2 2H8"/></svg>
                <span>验证</span>
              </button>
            </div>
            <div id="step2-msg" class="msg" hidden></div>
          </section>

          <!-- 第 3 步：识别信息 -->
          <section id="panel-3" hidden>
            <button class="btn btn-secondary" id="btn-recognize">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <span>开始识别</span>
            </button>
            <p class="hint">读取 nodeseek.com 登录 Cookie 并识别账号身份。</p>
            <div id="step3-msg" class="msg" hidden></div>
            <div id="account-box" class="account-box" hidden></div>
          </section>

          <!-- 第 4 步：保存并开启 -->
          <section id="panel-4" hidden>
            <p class="summary-meta" id="save-summary"></p>
            <div id="step4-msg" class="msg" hidden></div>
          </section>
        </div>

        <div class="wizard-footer">
          <div class="left">
            <button class="btn btn-ghost" id="btn-back" hidden>
              <svg id="icon-back" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              <span>上一步</span>
            </button>
          </div>
          <div class="right">
            <button class="btn btn-primary" id="btn-save-step" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span>保存并开始推送</span>
            </button>
            <button class="btn btn-primary" id="btn-next" hidden>
              <span>下一步</span>
              <svg id="icon-next" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- ============ 完成页 ============ -->
      <section id="complete-view" class="card" hidden>
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:12px 0;">
          <div style="width:56px;height:56px;border-radius:50%;background:var(--ns-green-soft);color:var(--ns-green);display:flex;align-items:center;justify-content:center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div style="font-size:16px;font-weight:600;">配置完成</div>
          <div style="color:var(--text-dim);font-size:13px;">将每 30 分钟静默推送 Cookie，popup 可随时查看推送状态。</div>
          <button class="btn btn-secondary" id="btn-complete-done">
            返回设置页
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </section>

      <!-- ============ 摘要视图 ============ -->
      <section id="summary-view" hidden>
        <p class="summary-meta">当前已配置 <strong id="sum-count">0</strong> 个推送槽位。</p>
        <div id="summary-list"></div>
        <div class="op-group" style="margin-top:14px;">
          <button class="btn btn-secondary" id="btn-add-slot">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>新增槽位</span>
          </button>
        </div>
      </section>
    </div>

    <script src="options.js"></script>
  </body>
</html>
