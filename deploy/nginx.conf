# NSAuth2 反向代理（nginx）示例 — 配合 Cloudflare 代理（橙云）使用
# 用法：改域名后与 docker-compose.yml 一起部署（compose 已挂载本文件与 ./ssl/ 证书）
#
# 说明：
# - 自签证书由部署脚本生成（openssl），配合 CF SSL 模式「Full」（接受自签）。
# - X-Forwarded-Proto 由 nginx 设置（$scheme），服务端据此发 HSTS；X-Forwarded-For 用于限流按真实 IP。
# - 不走 CF 时请换成 Let's Encrypt 证书（certbot --nginx）。

server {
    listen 80;
    server_name nodeseek-oauth.ailinyu.de nodeseek-ouath.ailinyu.de;
    # 直接反代（不 301）：Cloudflare SSL 模式为 Flexible 时回源到 80 走这里；
    # Full/Full Strict 时浏览器侧 https 由 CF 边缘保证，80 仅被 CF 回源使用。
    location / {
        proxy_pass http://nsauth2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nodeseek-oauth.ailinyu.de nodeseek-ouath.ailinyu.de;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    location / {
        proxy_pass http://nsauth2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
